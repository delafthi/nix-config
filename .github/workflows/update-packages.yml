name: Update packages
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"
jobs:
  update-packages:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Nix
        # Plain Nix, not Determinate: the Determinate daemon leaves flake
        # source paths unmaterialized, which breaks nix-update's evals
        # ("opening file ...-source: No such file or directory").
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - name: Configure git (used by nix run .#update for its commits)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update packages
        id: update
        continue-on-error: true
        run: |
          BASE=$(git rev-parse HEAD)
          nix run .#update
          if [ "$(git rev-parse HEAD)" = "$BASE" ]; then
            echo "No package updates."
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create pull request
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git checkout -b "update-packages-$(date +%Y%m%d)"
          git push origin "update-packages-$(date +%Y%m%d)"
          # HEAD carries one commit per updated package, e.g.
          # "packages/kicad-bin: 10.0.8 -> 10.0.9".
          gh pr create \
            --title "packages: update" \
            --body "Automated package updates via nix-update." \
            --label auto-merge \
            --label dependencies || true
      - name: Fail on update errors
        # Update step is continue-on-error so partial updates still get a PR;
        # surface its failure as the job's outcome here, at the very end.
        if: steps.update.outcome == 'failure'
        run: |
          echo "One or more package updates failed."
          exit 1
